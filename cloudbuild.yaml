substitutions:
  _REGION: northamerica-south1
  _REPOSITORY: dataflow-templates
  _SERVICE_NAME: pubsub-bigquery-ingestor
  _RUNTIME_SERVICE_ACCOUNT: cloud-run-pubsub-writer@dataflow-demo-507214.iam.gserviceaccount.com
  _BIGQUERY_DATASET: pubsub_demo
  _BIGQUERY_TABLE: events

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: verify
    name: maven:3.9.9-eclipse-temurin-21
    entrypoint: mvn
    args:
      - verify
      - --batch-mode

  - id: build-and-push-image
    name: maven:3.9.9-eclipse-temurin-21
    entrypoint: mvn
    args:
      - compile
      - jib:build
      - --batch-mode
      - -Dimage.name=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}
      - -Dimage.tag=$SHORT_SHA

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --no-allow-unauthenticated
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,BIGQUERY_DATASET=${_BIGQUERY_DATASET},BIGQUERY_TABLE=${_BIGQUERY_TABLE}
      - --set-secrets=INTEGRATION_DEMO_SECRET=integration-demo-secret:latest
